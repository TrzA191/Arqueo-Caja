<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arqueo de Caja</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Header con menú de navegación -->
    <header class="bg-primary text-white">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <h1 class="m-0">Gestión Contable</h1>
        </div>
    </header>
    <section class="bg-light p-4 rounded mb-4 shadow-sm position-relative">
        <nav class="nav-horizontal">
            <ul class="nav justify-content-end">
                <li class="nav-item"><a class="nav-link" href="/index.html">Libro Diario</a></li>
                <li class="nav-item"><a class="nav-link" href="/html/mayor.html">Libro Mayor</a></li>
                <li class="nav-item"><a class="nav-link" href="/html/arqueo.html">Arqueo de caja

                </a></li>
                <li class="nav-item"><a class="nav-link" href="/html/BC.html">Balanza de comprobación

                </a></li>
                <li class="nav-item">
                    <a class="nav-link active" href="/html/EstadoResult.html">Estado de resultados</a>
                
            </ul>
        </nav>
    </section>
    <div class="container">
        

        <div class="container-box">
            <div class="row">
                <div class="col-md-6">
                    <div class="section-title">Monedas</div>
                    <div id="coins-container">
                        <!-- Monedas se agregarán aquí dinámicamente -->
                        <div class="denomination-item">
                            <div class="row align-items-center">
                                <div class="col-6">
                                    <label class="form-label">Denominación</label>
                                    <select class="form-select coin-denomination">
                                        <option value="0.05">$0.05</option>
                                        <option value="0.10">$0.10</option>
                                        <option value="0.25">$0.25</option>
                                        <option value="0.50">$0.50</option>
                                        <option value="1" selected>$1</option>
                                        <option value="2">$2</option>
                                        <option value="5">$5</option>
                                        <option value="10">$10</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <label class="form-label">Cantidad</label>
                                    <input type="number" class="form-control coin-quantity" value="0" min="0">
                                </div>
                                <div class="col-2 d-flex align-items-end">
                                    <button class="btn btn-sm btn-danger btn-remove" onclick="removeDenomination(this, 'coins')">×</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-add" onclick="addDenomination('coins')">+ Agregar Moneda</button>
                    <div class="total-box">
                        Total Monedas: $<span id="coins-total">0.00</span>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="section-title">Billetes</div>
                    <div id="bills-container">
                        <!-- Billetes se agregarán aquí dinámicamente -->
                        <div class="denomination-item">
                            <div class="row align-items-center">
                                <div class="col-6">
                                    <label class="form-label">Denominación</label>
                                    <select class="form-select bill-denomination">
                                        <option value="20" selected>$20</option>
                                        <option value="50">$50</option>
                                        <option value="100">$100</option>
                                        <option value="200">$200</option>
                                        <option value="500">$500</option>
                                        <option value="1000">$1000</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <label class="form-label">Cantidad</label>
                                    <input type="number" class="form-control bill-quantity" value="0" min="0">
                                </div>
                                <div class="col-2 d-flex align-items-end">
                                    <button class="btn btn-sm btn-danger btn-remove" onclick="removeDenomination(this, 'bills')">×</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-sm btn-add" onclick="addDenomination('bills')">+ Agregar Billete</button>
                    <div class="total-box">
                        Total Billetes: $<span id="bills-total">0.00</span>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button class="btn btn-calculate" onclick="calculateTotal()">Calcular Total</button>
            </div>

            <div class="result-box" id="result-box">
                <h4>Resumen del Arqueo</h4>
                <p>Total Monedas: $<span id="final-coins-total">0.00</span></p>
                <p>Total Billetes: $<span id="final-bills-total">0.00</span></p>
                <hr>
                <h5>Total en Caja: $<span id="grand-total">0.00</span></h5>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Personalizado -->
    <script src="/scripts/arqueo.js"></script>
</body>
</html>
